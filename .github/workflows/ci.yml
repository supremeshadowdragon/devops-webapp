name: CI Pipeline

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Verify HTML file
        run: |
          echo "Starting CI pipeline..."
          test -f index.html
          echo "HTML file verified successfully!"
          echo "CI pipeline completed."